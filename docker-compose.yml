version: '3.8'

services:
  auth-service:
    build: ./auth-service
    ports:
      - "8000:8000"

  expense-service:
    build: ./expense-service
    ports:
      - "8001:8000"
    depends_on:
    - postgres

  postgres:
  image: postgres:16
  environment:
    POSTGRES_USER: splitbill
    POSTGRES_PASSWORD: splitbill
    POSTGRES_DB: splitbill
  ports:
    - "5432:5432"